name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: urban-linux-x86_64
            bin: urban
          - os: windows-latest
            artifact: urban-windows-x86_64
            bin: urban.exe
          - os: macos-latest
            artifact: urban-macos-arm64
            bin: urban
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxss-dev libwayland-dev libxkbcommon-dev libgl1-mesa-dev libudev-dev
      - name: Windows build environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Use Ninja for CMake on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install ninja -y --no-progress
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo build --release
      - run: cargo test --release
      - name: Package
        shell: bash
        run: |
          mkdir -p ../pkg
          cp target/release/${{ matrix.bin }} ../pkg/
          cp ../README.md ../ref/copying ../pkg/
          cp ../docs/FIXES.md ../pkg/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: pkg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: rust
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Zip
        run: cd dist && for d in */; do (cd "$d" && zip -r "../${d%/}.zip" .); done
      - uses: actions/checkout@v4
        with:
          path: src
      - name: Release notes
        run: |
          f="src/docs/RELEASE-${GITHUB_REF_NAME#v}.md"
          if [ -f "$f" ]; then cp "$f" notes.md; else echo "URBAN ${GITHUB_REF_NAME}" > notes.md; fi
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: notes.md
